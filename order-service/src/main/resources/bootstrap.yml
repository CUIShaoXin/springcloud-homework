server:
  port: 8082

spring:
  application:
    name: order-service

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: DEFAULT_GROUP
        file-extension: yaml
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
      datasource:
        flow:
          nacos:
            server-addr: localhost:8848
            namespace: dev
            data-id: order-service-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow


feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 3000
        loggerLevel: full

logging:
  level:
    com.example.userservice.client.UserClient: debug